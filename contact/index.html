<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <title>aiatsolution</title>
  </head>
  <body>
    <header class="header">
      <div class="header_container">
        <a href="/" class="header_container_logo">
          <img src="/img/logo.png" alt="aiatsolutionロゴ" />
        </a>
        <nav>
          <ul class="header_container_nav">
            <li><a href="/">ホーム</a></li>
            <li class="header_container_nav_item">
              <a href="#" class="accordion_trigger">サービス・事業内容</a>
              <img
                src="/img/accordionMenu_open.svg"
                alt="アコーディオンメニューOPEN"
                class="accordion_icon"
              />
              <ul class="accordion_menu">
                <li>
                  <a href="/service/trust_station/">Trust-Station</a>
                </li>
                <li><a href="/service/movie/">映像制作</a></li>
                <li><a href="/service/iideli/">いいデリ</a></li>
                <li><a href="/service/web/">ホームページ制作</a></li>
                <li>
                  <a href="/service/system/">システムアドバイザリーサービス</a>
                </li>
                <li><a href="/service/dev/">開発事業</a></li>
              </ul>
            </li>
            <li><a href="/works/">事例</a></li>
            <li><a href="/contact/">お問い合わせ</a></li>
            <li><a href="/company/">会社概要</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <section class="contactMv">
      <figure>
        <img src="/img/contact_mv_bg.jpg" alt="contactページmv" />
      </figure>
    </section>
    <main class="contact">
      <h1 class="contact_hdg">お問い合わせ</h1>
      <p class="contact_read">
        下記お問い合わせフォームよりお問い合わせください。
      </p>
      <form action="" method="">
        <label>
          <p>お名前</p>
          <input type="text" name="userName" placeholder="田中太郎" />
        </label>
        <label>
          <p>メールアドレス</p>
          <input type="email" name="useaMail" />
        </label>
        <label>
          <p>電話番号</p>
          <input type="tel" name="userTel" placeholder="000-0000-0000" />
        </label>
        <label>
          <p>お問い合わせ内容</p>
          <textarea name="message"></textarea>
        </label>
        <p class="contact_privacy">
          <a href="/contact/privacy_policy/">プライバシーポリシー</a
          >をご確認いただき、同意の上ご利用ください。
        </p>
        <button type="submit" class="contact_submit">送信</button>
      </form>
    </main>
    <footer class="footer">
      <div class="footer_container">
        <figure class="header_container_logo">
          <img src="/img/logo.png" alt="aiatsolutionロゴ" />
        </figure>
        <nav>
          <ul class="footer_container_nav">
            <li><a href="/">ホーム</a></li>
            <li><a href="#">サービス・事業内容</a></li>
            <li><a href="/works/">事例</a></li>
            <li><a href="/contact/">お問い合わせ</a></li>
            <li><a href="/company/">会社概要</a></li>
          </ul>
        </nav>
      </div>
      <small>© Copyright 2025 aiatsolution.</small>
    </footer>
    <script src="/script.js"></script>
  </body>
</html>
